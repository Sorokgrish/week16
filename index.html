<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=\, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/styles/normalize.css">
    <link rel="stylesheet" href="./assets/styles/style.css">
    <title>Forms</title>
</head>
<body>
    <form id="registrationForm" name="form">
        <label for="name">Имя:</label>
        <input type="text" id="name" name="name" placeholder="Введите имя" required pattern="[A-Za-z\s]{2,20}">
    
        <label for="email">Электронная почта:</label>
        <input type="email" id="email" name="email" placeholder="Введите электронную почту" required>
    
        <label for="age">Возраст:</label>
        <input type="number" id="age" name="age" placeholder="Введите возраст" required>
    
        <label>Пол:</label>
        <input type="radio" id="male" name="gender" value="Мужской">
        <label for="male">Мужской</label>
        <input type="radio" id="female" name="gender" value="Женский">
        <label for="Женский">Женский</label>
    
        <label for="profession">Профессия:</label>
        <select id="profession" name="profession" required>
          <option value="">Выберите профессию</option>
          <option value="doctor">Врач</option>
          <option value="programmer">Программист</option>
          <option value="teacher">Учитель</option>
          <option value="designer">Дизайнер</option>
          <option value="engineer">Инженер</option>
          <option value="seller">Продавец</option>
          <option value="other">Другое</option>
        </select>
    
        <label for="password">Пароль:</label>
        <input type="password" id="password" name="password" placeholder="Введите пароль" required minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}">
    
        <input type="checkbox" id="agreement" name="agreement" required>
        <label for="agreement">Согласен с обработкой данных</label>
    
        <button type="submit" id="submitBtn" disabled >Отправить</button>
      </form>
    <script src="./add.js"></script>
</body>
</html>
